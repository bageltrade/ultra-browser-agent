<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>Ultra Browser Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <!-- Top bar -->
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
      <nav class="tabs">
        <button class="tab active" data-tab="ask">Ask</button>
        <button class="tab" data-tab="run">Run</button>
        <button class="tab" data-tab="settings">Settings</button>
      </nav>
      <button class="icon-btn" id="newChatBtn" aria-label="New chat">✎</button>
    </header>

    <!-- Chat area -->
    <main class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="logo">UBA</div>
        <h1>Ultra Browser Agent</h1>
        <p>Describe a browser task in plain English. The agent plans, navigates, and extracts results.</p>
        <div class="chips">
          <button class="chip" data-prompt="Extract the top 5 Hacker News stories with rank, title, and points" data-url="https://news.ycombinator.com">HN top 5</button>
          <button class="chip" data-prompt="Go to example.com and extract the main heading and first paragraph" data-url="https://example.com">example.com</button>
          <button class="chip" data-prompt="Search Wikipedia for Alan Turing and extract the first sentence of the article" data-url="https://en.wikipedia.org">Wikipedia</button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </main>

    <!-- Composer -->
    <footer class="composer">
      <div class="url-row" id="urlRow">
        <input type="url" id="urlInput" placeholder="Optional start URL (https://…)" autocomplete="off" />
      </div>
      <div class="input-row">
        <button class="icon-btn small" id="attachBtn" title="Options">＋</button>
        <textarea id="input" rows="1" placeholder="Ask anything…" enterkeyhint="send"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="status-bar" id="statusBar">Ready · max 80 steps</div>
    </footer>
  </div>

  <!-- Settings sheet -->
  <div class="sheet hidden" id="settingsSheet">
    <div class="sheet-handle"></div>
    <h2>Settings</h2>
    <label>Max steps <span id="stepsVal">80</span>
      <input type="range" id="maxSteps" min="10" max="200" value="80" />
    </label>
    <label class="check"><input type="checkbox" id="headless" checked /> Headless browser</label>
    <p class="hint">Set <code>NVIDIA_API_KEY</code> in the environment before starting the server.</p>
    <button class="primary" id="closeSettings">Done</button>
  </div>
  <div class="overlay hidden" id="overlay"></div>

  <script src="/static/app.js"></script>
</body>
</html>
