[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultra-browser-agent"
version = "2.0.0"
description = "Skyvern-class hierarchical AI browser automation agent powered by NVIDIA Nemotron"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "poachdarling" }]
keywords = ["browser-automation", "ai-agent", "playwright", "llm", "skyvern", "nemotron"]
dependencies = [
  "playwright>=1.40.0",
  "openai>=1.40.0",
  "rich>=13.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "tenacity>=8.0.0",
  "pillow>=10.0.0",
  "aiofiles>=23.0.0",
]

[project.scripts]
uba = "run_agent:main"

[tool.setuptools.packages.find]
include = ["agent*"]
